# Headers de seguridad comunes. IMPORTANTE (gotcha nginx): cualquier location
# con su propio add_header DESCARTA los headers del bloque server, así que este
# snippet debe incluirse en CADA location que declare add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# microphone=(self): lo necesita el camarero de voz de la carta de mesa
# (/<slug>/carta). Antes era `microphone=()`, que es lista VACÍA —ni siquiera el
# propio origen—, así que getUserMedia fallaba con NotAllowedError sin llegar a
# enseñar el diálogo de permiso: el micro no arrancaba y no había forma de
# saber por qué desde el JavaScript.
# `(self)` es lo mínimo que funciona: habilita pidoo.es y NADA de terceros. No
# poner `*` ni añadir orígenes externos, que abriría el micro a cualquier
# iframe incrustado en todo el dominio.
add_header Permissions-Policy "microphone=(self), camera=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
