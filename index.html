<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <!-- Sin `maximum-scale` ni `user-scalable=no`: bloqueaban el zoom en TODA la
         app (WCAG 1.4.4). El zoom de iOS al enfocar un campo se evita con
         font-size >= 16px en los inputs, que ya está en index.css, no
         prohibiéndole ampliar a quien no ve bien. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pidoo" />
    <!-- Smart App Banner: Safari iOS muestra arriba, automáticamente, un banner
         nativo "Pidoo · ABRIR/VER" que lleva a la App Store (id 6759052572). -->
    <meta name="apple-itunes-app" content="app-id=6759052572" />
    <meta name="theme-color" content="#F7F3EC" />
    <!-- SIN CIFRA A PROPÓSITO. Aquí ponía "Más de 100 restaurantes" y en la
         base de datos hay 9: es el texto que pinta Google y el que se despliega
         al compartir el enlace por WhatsApp, o sea el sitio donde una cifra
         inflada se comprueba en diez segundos. Cualquier número que se escriba
         aquí envejece solo, porque este fichero es estático: si algún día hay
         que dar volumen, que salga de `landing_vitrina()` como el del hero. -->
    <meta name="description" content="Pide comida a domicilio o recógela tú mismo en Tenerife. Restaurantes de la isla, pago con tarjeta o en efectivo y reparto de socios locales." />
    <meta property="og:title" content="Pidoo · Comida a domicilio en Tenerife" />
    <meta property="og:description" content="Pide en los restaurantes de tu zona en Tenerife. Reparto local, y tú eliges si pagas con tarjeta o en efectivo." />
    <!-- og-pidoo.png = nombre NUEVO a propósito: iMessage/WhatsApp cachean la
         preview por URL; si se reutiliza favicon-512.png seguirían enseñando
         el logo viejo aunque el archivo cambie. -->
    <meta property="og:image" content="https://pidoo.es/og-pidoo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://pidoo.es/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://pidoo.es/" />
    <!-- Preconnect: la primera query de datos y las fuentes no pagan DNS+TLS tras parsear el JS -->
    <link rel="preconnect" href="https://rmrbxrabngdmpgpfmjbo.supabase.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fuentes en un solo <link> (antes: @import en index.css + @import runtime en AppShell → render-blocking + FOUT tardío) -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;0,9..40,800&display=swap" />
    <title>Pidoo · Comida a domicilio en Tenerife</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
