<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#FAF3EC"><title>Descarga la app Pidoo</title></head><body><style>
  :root{
    --cream:#FAF3EC; --cream2:#F3E8DC; --orange:#FF6B2C; --orange2:#FF8A47;
    --dark:#241f1b; --muted:#8b7e72; --card:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  .pidoo-wrap{
    min-height:100vh;min-height:100dvh;width:100%;
    display:flex;align-items:center;justify-content:center;padding:26px 18px;
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    color:var(--dark);position:relative;overflow:hidden;
    background:
      radial-gradient(60% 45% at 15% 8%, rgba(255,107,44,.16), transparent 60%),
      radial-gradient(55% 45% at 90% 100%, rgba(255,107,44,.14), transparent 60%),
      var(--cream);
  }
  .card{
    width:100%;max-width:440px;background:var(--card);
    border-radius:30px;padding:38px 30px 30px;
    box-shadow:0 30px 70px -30px rgba(120,60,20,.45), 0 4px 14px rgba(120,60,20,.08);
    text-align:center;animation:rise .6s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .logo{width:200px;max-width:64%;height:auto;display:block;margin:0 auto 6px}
  .eyebrow{font-size:12.5px;letter-spacing:2.5px;font-weight:700;color:var(--muted);
    text-transform:uppercase;margin-bottom:16px}
  h1{font-size:29px;line-height:1.15;font-weight:800;margin-bottom:10px;letter-spacing:-.3px}
  h1 span{color:var(--orange)}
  .sub{font-size:15.5px;line-height:1.5;color:var(--muted);margin:0 auto 24px;max-width:330px}
  .rest{display:none;font-weight:700;color:var(--dark)}
  .rlogo{display:none;width:86px;height:86px;border-radius:22px;object-fit:cover;
    margin:2px auto 14px;border:3px solid #fff;
    box-shadow:0 10px 26px -8px rgba(120,60,20,.45), 0 0 0 1.5px rgba(255,107,44,.35)}
  .stores{display:flex;flex-direction:column;gap:14px;align-items:center}
  .store{display:inline-flex;align-items:center;gap:12px;background:#000;
    border:1px solid rgba(255,255,255,.30);border-radius:13px;
    padding:11px 22px;min-width:236px;text-decoration:none;color:#fff;
    transition:transform .12s ease, box-shadow .2s ease}
  .store:active{transform:scale(.97)}
  .store .glyph{width:30px;height:30px;display:flex;align-items:center;justify-content:center;flex:none}
  .store .glyph svg{width:30px;height:30px;display:block}
  .store .txt{display:flex;flex-direction:column;line-height:1.05;text-align:left}
  .store .txt small{font-size:11px;font-weight:500;letter-spacing:.3px}
  .store .txt b{font-size:22px;font-weight:600;letter-spacing:.2px;margin-top:2px}
  .store .txt .caps{text-transform:uppercase;font-size:10px;letter-spacing:.6px}
  .store.you{box-shadow:0 0 0 3px rgba(255,107,44,.6), 0 12px 24px -12px rgba(0,0,0,.5)}
  .hint{margin-top:18px;font-size:13px;color:var(--muted)}
  .hint a{color:var(--orange);text-decoration:none;font-weight:700}
  .foot{margin-top:22px;font-size:12.5px;color:var(--muted)}
  .foot b{color:var(--dark)}
  @media(max-width:360px){h1{font-size:25px}.card{padding:30px 22px 24px}}
</style>
